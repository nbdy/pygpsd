[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygpsd"
version = "1.3.0"
requires-python = ">= 3.10"
dependencies = []
authors = [{name = "nbdy"}]
maintainers = [{name = "nbdy"}]
readme = "README.md"
license = {text = "MIT License"}
keywords = ["gps", "gpsd", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "coverage==7.11.0",
]
dev = [
    "pylint==4.0.2",
]

[project.urls]
Homepage = "https://github.com/nbdy/pygpsd"
Documentation = "https://github.com/nbdy/pygpsd/wiki"
Repository = "https://github.com/nbdy/pygpsd.git"
Issues = "https://github.com/nbdy/pygpsd/issues"
